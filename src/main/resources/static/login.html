
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Pronta Entrega | Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #172033;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    .logo {
      width: 55px;
      height: 55px;
      background: #172033;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 28px;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitulo {
      color: #64748b;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #2864ad;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #2864ad;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4e8a;
    }

    .alerta {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 7px;
      font-size: 14px;
      text-align: center;
    }

    .erro {
      background: #fee2e2;
      color: #991b1b;
    }

    .sucesso {
      background: #dcfce7;
      color: #166534;
    }

    .rodape {
      margin-top: 25px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">

    <div class="logo" aria-hidden="true">PE</div>

    <h1>Pronta Entrega</h1>

    <p class="subtitulo">
      Acesso ao sistema de estoque e vendas
    </p>

    <div id="alerta" role="status" hidden></div>

    <form action="/login" method="post">

      <label for="username">Usuário</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Digite seu usuário"
        autocomplete="username"
        required
      >

      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >

      <input
        type="hidden"
        id="csrf"
        name="_csrf"
      >

      <button type="submit">
        Entrar no sistema
      </button>

    </form>

    <div class="rodape">
      Sistema Pronta Entrega · Projeto acadêmico
    </div>

  </main>

  <script>
    // Recuperar o token CSRF do cookie
    const cookie = document.cookie
      .split(";")
      .map(c => c.trim())
      .find(c => c.startsWith("XSRF-TOKEN="));

    if (cookie) {
      document.getElementById("csrf").value =
        decodeURIComponent(
          cookie.substring("XSRF-TOKEN=".length)
        );
    }

    // Exibir mensagens de autenticação
    const parametros = new URLSearchParams(
      window.location.search
    );

    const alerta = document.getElementById("alerta");

    if (parametros.has("error")) {
      alerta.textContent =
        "Usuário ou senha incorretos.";
      alerta.className = "alerta erro";
      alerta.hidden = false;
    }

    if (parametros.has("logout")) {
      alerta.textContent =
        "Você saiu do sistema com sucesso.";
      alerta.className = "alerta sucesso";
      alerta.hidden = false;
    }
  </script>
</body>
</html>
