
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pronta Entrega | Vendas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #172033;
            margin: 0;
            padding: 35px;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        select, input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px;
        }

        button {
            background: #2864ad;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .remover {
            background: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
        }

        #mensagem {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Pronta Entrega</h1>
    <p>Registro de vendas de roupas no atacado</p>

    <div class="card">

        <h2>Registrar nova venda</h2>

        <form id="formVenda">

            <label for="cliente">Cliente:</label>

            <select id="cliente" required>
                <option value="">
                    Selecione o cliente
                </option>
            </select>

            <h3>Adicionar produtos</h3>

            <label for="produto">Produto:</label>

            <select id="produto">
                <option value="">
                    Selecione o produto
                </option>
            </select>

            <label for="quantidade">Quantidade:</label>

            <input type="number"
                   id="quantidade"
                   min="1"
                   step="1"
                   value="1">

            <button type="button" id="adicionarProduto">
                Adicionar produto
            </button>

            <p id="estoqueDisponivel"></p>

            <h3>Produtos da venda</h3>

            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="itensVenda">
                    <tr>
                        <td colspan="5">
                            Nenhum produto adicionado.
                        </td>
                    </tr>
                </tbody>
            </table>

            <p class="total">
                Total:
                <span id="totalVenda">R$ 0,00</span>
            </p>

            <button type="submit">
                Confirmar venda
            </button>

        </form>

        <p id="mensagem" role="status"></p>

    </div>

    <div class="card">

        <h2>Vendas realizadas</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Data</th>
                    <th>Valor total</th>
                </tr>
            </thead>

            <tbody id="listaVendas"></tbody>
        </table>

    </div>

</div>

<script src="vendas.js"></script>
<script src="/menu.js"></script>
</body>
</html>
